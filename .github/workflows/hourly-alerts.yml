name: Hourly trading news alerts

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  send-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger hourly news check
        env:
          PUBLIC_URL: ${{ secrets.TRADING_BOT_PUBLIC_URL }}
          ALERTS_CRON_SECRET: ${{ secrets.ALERTS_CRON_SECRET }}
        run: |
          test -n "$PUBLIC_URL"
          test -n "$ALERTS_CRON_SECRET"
          curl --fail --silent --show-error --max-time 60 \
            -X POST "${PUBLIC_URL%/}/hourly-alerts" \
            -H "X-Alert-Secret: $ALERTS_CRON_SECRET"
