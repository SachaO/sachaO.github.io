name: ATLAS Cubrik MCP integration check

on:
  push:
    branches: [main]
    paths:
      - "telegram_bot/**"
      - ".github/workflows/atlas-cubrik-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "telegram_bot/**"
      - ".github/workflows/atlas-cubrik-check.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bot dependencies
        run: python -m pip install --upgrade pip && pip install -r telegram_bot/requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q telegram_bot

      - name: Smoke-test MCP OAuth imports and read-only tool allowlist
        working-directory: telegram_bot
        run: |
          python - <<'PY'
          import cubrik_mcp
          from mcp import ClientSession
          from mcp.client.auth import AuthorizationCodeResult, OAuthClientProvider
          from mcp.client.streamable_http import streamable_http_client

          forbidden = {"start_agent", "run_agent_now", "create_agent", "update_agent", "place_order"}
          configured = {
              name
              for aliases in cubrik_mcp.READ_TOOL_ALIASES.values()
              for name in aliases
          }
          assert not (forbidden & configured), forbidden & configured
          print("MCP client imports OK; ATLAS tool allowlist is read-only.")
          PY
